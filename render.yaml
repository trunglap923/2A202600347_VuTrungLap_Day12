services:
  - type: web
    name: ai-agent-production-final
    runtime: docker
    # Trỏ thẳng vào thư mục dự án cuối cùng
    rootDir: my-production-agent
    dockerContext: .
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      # Các biến Secret khác bạn cần nạp trên Dashboard Render
